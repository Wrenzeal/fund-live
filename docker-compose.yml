# Docker Compose for local FundLive PostgreSQL and DragonFly services.
# Runtime should follow fundlive.yaml; this file is only a local example.
#
# Usage:
#   docker-compose up -d     # Start database in background
#   docker-compose down      # Stop database
#   docker-compose logs db cache   # View service logs

services:
  db:
    image: postgres:15-alpine
    container_name: fundlive_db
    restart: unless-stopped
    ports:
      - "15432:5432" # Host port 15432 -> Container port 5432
    environment:
      POSTGRES_USER: fundlive
      POSTGRES_PASSWORD: fundlive_secret
      POSTGRES_DB: fundlive
      TZ: Asia/Shanghai
    volumes:
      - ./pgdata:/var/lib/postgresql/data # Persist data across restarts
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fundlive -d fundlive" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    container_name: fundlive_cache
    restart: unless-stopped
    command: [ "--logtostderr" ]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - fundlive_dragonfly_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  lean-worker:
    profiles: [ "quant" ]
    build:
      context: .
      dockerfile: quant/lean-worker/Dockerfile
      args:
        LEAN_COMMIT: 0136529cd8d9194f401aa5322bf90e547d1f0b56
    container_name: fundlive_lean_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: fundlive
      DB_PASSWORD: fundlive_secret
      DB_NAME: fundlive
      DB_SSLMODE: disable
      REDIS_URL: redis://cache:6379/0
      REDIS_KEY_PREFIX: fundlive
      LEAN_WORKER_GROUP: lean-workers
      LEAN_JOB_TIMEOUT_MINUTES: 30
    volumes:
      - fundlive_lean_jobs:/var/lib/fundlive/lean-jobs

volumes:
  fundlive_dragonfly_data:
  fundlive_lean_jobs:
