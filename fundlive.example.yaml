# FundLive Project Configuration
# Copy this file to fundlive.yaml in the project root.
# Environment variables still override these values when set.

server:
  port: 8080
  allowed_origins:
    - http://127.0.0.1:3000
    - http://localhost:3000

storage:
  mode: postgres

cache:
  redis_url: redis://127.0.0.1:16380/0
  key_prefix: fundlive

quote:
  default_source: sina
  # QDII / overseas holdings use a fixed source independent from user quote preference.
  # Supported today: tencent, sina. Default is tencent to preserve existing behavior.
  overseas_source: tencent

database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: your-db-password
  name: my-db
  ssl_mode: disable
  timezone: Asia/Shanghai
  log_level: warn
  auto_migrate: false

auth:
  cookie_name: fundlive_session
  cookie_secure: false
  session_ttl_hours: 720
  google_client_id: ""
  auth_attempt_window_minutes: 15
  max_password_failures: 5
  max_register_failures: 8
  max_google_login_failures: 10
  # Set AUTH_EMAIL_CODE_ENABLED=true and keep secrets in a systemd/env file.
  email_code_enabled: false
  email_driver: dev
  email_code_ttl_minutes: 10
  email_resend_cooldown_seconds: 60
  max_email_sends_per_hour: 5
  max_ip_email_sends_per_hour: 20
  max_email_code_failures: 5
  smtp_host: smtp.resend.com
  smtp_port: 587
  smtp_username: resend
  smtp_from: fundlive@mail.wrenzeal.top
  smtp_from_name: FundLive
  smtp_security: starttls
  smtp_timeout_seconds: 15
